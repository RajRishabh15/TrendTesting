<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vrindavan — An Evening With Krishna</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amita:wght@400;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Parallax Background -->
    <div class="background-container">
        <div class="background-image" id="parallax-bg"></div>
        <div class="particles" id="particles-container"></div>
        <div class="overlay-gradient"></div>
    </div>

    <!-- UI Overlay -->
    <main class="ui-layer">
        
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="time-indicator">
                <span class="icon diya-icon">🪔</span>
                <span id="current-time">6:42 PM</span>
                <span class="location">Vrindavan</span>
            </div>
            
            <div class="now-playing-indicator">
                <span class="music-icon">🎵</span>
                <span>Bhajan</span>
            </div>
        </header>

        <!-- Main Title -->
        <div class="title-container">
            <h2 class="subtitle">कृष्ण भक्ति</h2>
            <h1 class="main-title">वृन्दावन की संध्या</h1>
            <div class="title-divider">
                <span class="divider-icon">🌳</span>
                <div class="wave"></div>
                <span class="river-text">YAMUNA RIVER</span>
            </div>
        </div>

        <!-- Music Player -->
        <div class="music-player-container">
            <div class="glass-player">
                <div class="album-art">
                    <img id="track-art" src="assets/album_art_1.png" alt="Album Art">
                    <div class="playing-bars" id="playing-bars">
                        <span></span><span></span><span></span>
                    </div>
                </div>
                
                <div class="track-info">
                    <h3 id="track-title">Shri Krishna Govind</h3>
                    <p id="track-artist">Devotional</p>
                </div>

                <div class="player-controls">
                    <div class="progress-container" id="progress-container">
                        <span class="time" id="current-time-display">0:00</span>
                        <div class="progress-bar-bg" id="progress-bg">
                            <div class="progress-bar-fill" id="progress-fill"></div>
                        </div>
                        <span class="time" id="duration-display">3:45</span>
                    </div>

                    <div class="buttons">
                        <button class="control-btn small" id="prev-btn">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                        </button>
                        <button class="control-btn play-btn" id="play-btn">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button class="control-btn small" id="next-btn">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>
                    </div>
                </div>
                
                <!-- Volume Control -->
                <div class="volume-container">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <input type="range" id="volume-slider" min="0" max="100" value="70">
                </div>
            </div>
        </div>
    </main>

    <!-- Audio Element (hidden) -->
    <audio id="audio-element"></audio>
    
    <script src="script.js"></script>
</body>
</html>
