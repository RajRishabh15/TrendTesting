<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vrindavan — An Evening With Krishna</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amita:wght@400;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Parallax Background -->
    <div class="background-container">
        <div class="background-image" id="parallax-bg"></div>
        <div class="particles" id="particles-container"></div>
        <div class="overlay-gradient"></div>
    </div>

    <!-- UI Overlay -->
    <main class="ui-layer">
        
        <!-- Top Bar -->
    <header class="top-bar">
        <div class="top-left-group">
            <a href="https://www.linkedin.com/in/rishabhr15/" target="_blank" rel="noopener noreferrer" class="social-link" title="LinkedIn">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                </svg>
            </a>
            <div class="location-badge">
                <span class="icon">🪔</span>
                <span class="time" id="current-time">10:38 PM</span>
                <span class="location">Vrindavan</span>
            </div>
        </div>
        <button class="playlist-toggle-btn" id="playlist-toggle-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
            Playlist
        </button>
    </header>

        <!-- Main Title -->
        <div class="title-container">
            <h2 class="subtitle">कृष्ण भक्ति</h2>
            <h1 class="main-title">वृन्दावन की संध्या</h1>
        </div>

        <!-- Music Player -->
        <div class="music-player-container">
            <div class="glass-player modern-krishna-player">
                <div class="album-art-container">
                    <img id="track-art" src="assets/album_art_1.png" alt="Album Art">
                    <div class="playing-bars" id="playing-bars">
                        <span></span><span></span><span></span>
                    </div>
                </div>
                
                <div class="track-info">
                    <div class="track-info-inner" id="track-info-inner">
                        <h3 id="track-title">Shri Krishna Govind</h3>
                        <p id="track-artist">Devotional</p>
                    </div>
                </div>

                <div class="player-controls">
                    <div class="progress-container" id="progress-container">
                        <span class="time" id="current-time-display">0:00</span>
                        <div class="progress-bar-bg" id="progress-bg">
                            <div class="progress-bar-fill" id="progress-fill"></div>
                        </div>
                        <span class="time" id="duration-display">0:00</span>
                    </div>

                    <div class="buttons">
                        <button class="control-btn small" id="prev-btn">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                        </button>
                        <button class="control-btn play-btn" id="play-btn">
                            <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button class="control-btn small" id="next-btn">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>
                    </div>
                </div>
                
                <!-- Volume Control -->
                <div class="volume-container">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <input type="range" id="volume-slider" min="0" max="100" value="70">
                </div>
            </div>
        </div>
    </main>

    <!-- Playlist Sidebar -->
    <div class="playlist-sidebar" id="playlist-sidebar">
        <div class="sidebar-header">
            <h2><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="vertical-align: middle; margin-right: 8px;"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg> Up Next</h2>
            <button class="close-sidebar-btn" id="close-sidebar-btn">&times;</button>
        </div>
        <div class="sidebar-list" id="sidebar-list">
            <!-- Items will be injected here dynamically -->
        </div>
    </div>

    <!-- YouTube Player (hidden) -->
    <div id="yt-player-container" style="position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none;">
        <div id="yt-player"></div>
    </div>
    
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>
</html>
